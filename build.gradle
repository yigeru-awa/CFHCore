plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = mod_version
group = mod_group_id
repositories {
    clear()
    mavenLocal()
    mavenCentral()
    maven {
        name = "NeoForged CDN Releases"
        url = "https://neoforged.forgecdn.net/releases"
    }
    maven {
        name = "NeoForged CDN Mojang Meta"
        url = "https://neoforged.forgecdn.net/mojang-meta"
    }
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net/"
    }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}
base {
    archivesName = mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
dependencies {
    // Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Modern UI
    implementation("curse.maven:modern-ui-352491:8206075")

    // XAero Compat (compileOnly)
    compileOnly fileTree(dir: "libs/xaero", include: ["*.jar"])

    // Sodium
    compileOnly files("libs/sodium-neoforge-0.8.13.jar")

    // EMI (vendored fork) - compileOnly so it is never bundled; the fork is
    // shaded into the CFHCore jar at runtime.
    compileOnly files("libs/emi/emi-1.1.24+1.21.1+neoforge.jar")
}

// The vendored EMI fork carries its own @Mod("emi") entrypoint
// (EmiNeoForge). CFHCore ships as mod id "cfhcore" only, so that
// class must not be packaged — NeoForge would treat it as a separate
// mod "emi" that isn't declared in mods.toml and crash at startup.
jar {
    exclude("com/onehumanawa/cfhcore/content/gui/emi/platform/neoforge/EmiNeoForge.class")
}
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
idea {
    module {
        downloadSources = false
        downloadJavadoc = false
    }
}