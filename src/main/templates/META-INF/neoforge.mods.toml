modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
[[mixins]]
config = "${mod_id}.ctm.mixins.json"
[[mixins]]
config = "${mod_id}.ctm.sodium.mixins.json"
[[mixins]]
config = "${mod_id}.worldgen.mixins.json"
[[mixins]]
config = "${mod_id}.worldgen.neoforge.mixins.json"
[[mixins]]
config = "${mod_id}.gui.mixins.json"
[[mixins]]
config = "${mod_id}.gui.menu.mixins.json"
[[mixins]]
config = "${mod_id}.gui.neoforge.mixins.json"
[[mixins]]
config = "${mod_id}.gui.xaero.mixins.json"
[[mixins]]
config = "${mod_id}.gui.maps.mixins.json"
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId="create"
type="required"
versionRange="[6.0.10,6.1.0)"
ordering="NONE"
side="BOTH"
[[dependencies."${mod_id}"]]
modId="modernui"
type="optional"
versionRange="[3.13,4.0)"
ordering="AFTER"
side="CLIENT"